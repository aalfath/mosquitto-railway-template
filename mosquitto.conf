# Mosquitto configuration for the Railway template.
# Users come from a password file that the start script writes on every boot
# from MQTT_USERNAME / MQTT_PASSWORD (plus MQTT_EXTRA_USERS, if set).

# Every client must log in.
allow_anonymous false
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/config/passwd

# Retained messages, persistent sessions and queued QoS 1/2 messages live on
# the Railway volume. Written every 60 s and on shutdown.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Plain MQTT on all addresses (IPv4 and IPv6): Railway's TCP proxy and the
# private network (mosquitto.railway.internal:1883).
listener 1883

# MQTT over WebSocket, reached through Caddy on the Railway domain.
listener 9001 127.0.0.1
protocol websockets

# Built-in dashboard and HTTP API, reached through Caddy. Same login as MQTT.
listener 9883 127.0.0.1
protocol http_api
http_dir /usr/share/mosquitto/dashboard

# Health check only: Caddy maps /healthz to /api/v1/version on this listener.
listener 9884 127.0.0.1
protocol http_api
listener_allow_anonymous true
